:root{--ink:#f3e9fc;--muted:#b49ccc;--dim:#76628c;--accent:#e9c6ff;--bg:#030105}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;touch-action:manipulation;cursor:pointer}
#scene canvas{display:block;width:100%;height:100%}
#fade{position:fixed;inset:0;background:var(--bg);z-index:5;pointer-events:none;transition:opacity 2.4s ease}
#fade.off{opacity:0}

#label{position:fixed;left:50%;top:72%;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap;transition:opacity 1.2s ease;z-index:2}
#label.hide{opacity:0}
.cap{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
#count{font-weight:300;font-size:clamp(21px,5vw,27px);letter-spacing:.07em;color:var(--ink);font-variant-numeric:tabular-nums}
#count .d{color:var(--muted);font-size:.6em;letter-spacing:.14em;margin:0 .7em 0 .3em;vertical-align:.12em}
#when{font-size:13px;font-weight:400;letter-spacing:.08em;color:var(--muted);margin-top:10px}
#when.pulse{color:var(--accent);animation:pulse 2.6s ease-in-out infinite}
#hint{font-size:11px;letter-spacing:.24em;color:var(--accent);margin-top:12px;opacity:0;transition:opacity .5s ease;min-height:1em}
#hint.on{opacity:.9}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

#player{position:fixed;left:50%;bottom:max(30px,calc(env(safe-area-inset-bottom) + 18px));transform:translate(-50%,14px);width:min(360px,88vw);text-align:center;opacity:0;pointer-events:none;transition:opacity 1.8s ease,transform 1.8s ease;z-index:3}
#player.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#player .title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.34em;color:var(--accent);margin-bottom:14px}
.bar{display:flex;align-items:center;gap:14px;padding:9px 18px 9px 9px;border-radius:999px;background:rgba(42,16,60,.34);border:1px solid rgba(233,198,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#play{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(233,198,255,.38);background:rgba(233,198,255,.08);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .3s}
#play:hover{background:rgba(233,198,255,.16)}
#play:disabled{opacity:.35;cursor:default}
#play svg{width:14px;height:14px;fill:currentColor}
#track{flex:1;height:2px;border-radius:2px;background:rgba(233,198,255,.18);position:relative;cursor:pointer}
#track::before{content:"";position:absolute;left:0;right:0;top:-14px;bottom:-14px}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--accent);box-shadow:0 0 10px rgba(233,198,255,.7)}
#time{flex:none;min-width:70px;text-align:right;font-size:11px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
#note{font-size:11.5px;letter-spacing:.04em;color:var(--dim);margin-top:10px;min-height:1em;white-space:normal}

.nogl #label{top:50%;transform:translate(-50%,-50%)}
</style>
</head>

</div>

    <div id="track"><div id="fill"></div></div>

</div>
